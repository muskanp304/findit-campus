version: '3.8'

services:
  findit-campus-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: findit-campus:latest
    container_name: findit_campus_prod
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - campus_net

networks:
  campus_net:
    driver: bridge
